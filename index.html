<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quản lý văn bản</title>
  <style>
    html,body{margin:0;height:100%;background:#f5f7fb;font-family:Arial,Helvetica,sans-serif}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
    .msg{max-width:560px;margin:60px auto;padding:24px;background:#fff;border:1px solid #e4e7ec;border-radius:12px;line-height:1.6}
    .open{position:fixed;right:10px;bottom:10px;z-index:5;font-size:12px;background:#fff;border:1px solid #d0d5dd;border-radius:8px;padding:6px 10px;color:#344054;text-decoration:none;opacity:.85}
  </style>
</head>
<body>
<script>
  // Dán URL Web App của Apps Script (kết thúc bằng /exec) vào giữa hai dấu nháy:
  var WEB_APP_URL='https://script.google.com/macros/s/AKfycbxdz6mBmlbqFZk8Xv36MAHaglAn6-VY78Hr03RaPPB2E2qN4vsEZHSgGT1-HDCxUuB1Dw/exec';

  if(!/^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\/s\/[A-Za-z0-9_-]{20,}\/exec$/.test(WEB_APP_URL)){
    document.body.innerHTML='<div class="msg"><b>Chưa cấu hình WEB_APP_URL.</b><br>Mở file <code>index.html</code>, dán URL Web App thật (dạng <code>https://script.google.com/macros/s/.../exec</code>) vào dòng <code>var WEB_APP_URL=\'\';</code>.</div>';
  }else{
    var f=document.createElement('iframe');
    f.src=WEB_APP_URL;
    f.title='Quản lý văn bản';
    f.allow='clipboard-write; fullscreen';
    document.body.appendChild(f);
    var a=document.createElement('a');
    a.className='open';a.href=WEB_APP_URL;a.target='_blank';a.rel='noopener';
    a.textContent='Mở toàn màn hình ↗';
    document.body.appendChild(a);
  }
</script>
</body>
</html>
